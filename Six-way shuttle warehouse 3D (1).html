function frg(g,i,n){const p=g.p,q=m=>Math.min(g.nA-1,Math.round(m*(g.nA-1)/Math.max(1,n-1))),k=q(i);let d=0;for(let m=0;m<i;m++)if(q(m)==k)d++;return p.rack_x_min+k*g.uw+(g.nF==2?g.dep:0)+p.aisle_width/2+d*(p.lift_w+.3)}
function liftC(g,cfg,nl){const p=g.p,c1=p.rack_x_min+p.lift_w/2,c2=Math.max(c1,g.cE-p.lift_w/2),m=(c1+c2)/2,r=[];for(let i=0;i<nl;i++)r.push(cfg=='front'?frg(g,i,nl):cfg=='middle'?m+(i-(nl-1)/2)*(p.lift_w+.3):nl==1?m:c1+i*(c2-c1)/(nl-1));return r}
function bayP(g,l){const{p,Ab,Cb}=g,cb=p.rack_x_min/2,cf=Cb-2;return{same_side:[[4,cb],[9,cb]],opposite:[[Ab/2,cb],[Ab/2,cf]],corners:[[3,cb],[Ab-3,cf]],corners_rev:[[Ab-3,cb],[3,cf]]}[l]}
function Tof(g,lcs,B,off){const{p,nL,nA,nC,nF,dep,uw}=g,cv=B.map(([a,c])=>Math.min(...lcs.map(l=>Math.abs(a-l.a)+Math.abs(c-l.c)))),conv=(cv[0]*p.in_rate+cv[1]*p.out_rate)/(p.in_rate+p.out_rate),XA=[...new Set(lcs.map(l=>l.a))],dm=[...Array(nC)].reduce((s,_,i)=>s+Math.min(...XA.map(x=>Math.abs(off(i)-x))),0)/nC;
let cr=0;for(const l of lcs)for(let k=0;k<nA;k++)cr+=Math.abs(l.c-(p.rack_x_min+k*uw+(nF==2?dep:0)+p.aisle_width/2));cr/=lcs.length*nA;
const tl=tt(p.first_level+nL*p.level_pitch/2,p.lift_v,p.lift_a),xm=p.transfer_mode=='chain'?p.chain_xfer_s:p.shuttle_xfer_s,lc=2*tl+2*p.lift_pos_s+p.chain_xfer_s+xm,sh=p.shuttle_policy=='roaming'?(1-1/nL)*(p.shuttle_xfer_s+tl):0,
sc=p.lane_xfer_s+p.liftside_xfer_s+2*tt(dm,p.shuttle_v,p.shuttle_a)+2*tt(dep/2+p.aisle_width/2,p.shuttle_v,p.shuttle_a)+2*p.turn_s+sh+2*tt(cr,p.shuttle_v,p.shuttle_a);
return{conv,cr,dm,sc,T:conv/p.conveyor_v+lc/2+sc/2}}
function report(){const g=geo(),p=P,L=LAST,pk=L.pk,{nL,nA,nC,nF,nD,nl,ns}=g,cap=nL*nA*nC*nF*nD;let h='';
h+=`<h2>A. Warehouse design</h2><p>${nL} levels · ${nA} aisles · ${nC} lane columns · ${nF} faces · ${nD}-deep channels · aisles along ${p.orientation} · ${cap} pallets (need ${p.required_capacity}) · ${nl} lifts (${p.lift_config}) · ${ns} shuttles (${p.shuttle_policy}) · ${p.transfer_mode} transfer</p>`;
h+=`<h2>B. Best bay layout and lift location (lead-time index = conveyor + lift ride + shuttle, seconds)</h2><table><tr><th>Bay layout</th><th>Lifts</th><th>Lifts (along aisle / across, m)</th><th>Conveyor (m)</th><th>Shuttle cycle (s)</th><th>Index (s)</th><th>Index, worst lift down (s)</th><th>Shuttle util.</th></tr>`;
for(const lay of LAY){const B=bayP(g,lay),c=SEL.lift_config.map(cfg=>{const X=lay(g,cfg,nl),lc=X.L,a=Tof(g,lc,B,X.off);let dg=a.T;if(nl>1)lc.forEach((_,i)=>{dg=Math.max(dg,Tof(g,lc.filter((_,j)=>j!=i),B,X.off).T)});return{cfg,lc,...a,dg,su:pk/(ns*3600/a.sc)}}),b=Math.min(...c.map(x=>x.T));
c.forEach(x=>h+=`<tr class="${x.T==b?'bst':''}"><td>${lay}</td><td>${x.cfg}${x.T==b?' ★':''}</td><td>${x.lc.map(v=>f(v.a,0)+'/'+f(v.c,0)).join(', ')}</td><td>${f(x.conv,1)}</td><td>${f(x.sc)}</td><td>${f(x.T)}</td><td>${f(x.dg)}</td><td>${f(x.su*100)}%</td></tr>`)}
h+='</table><p>★ = lowest index for that bay layout. Lift utilisation does not depend on layout; layout changes conveyor and shuttle cross-aisle travel.</p>';
const scR=L.sc+(p.shuttle_policy=='roaming'?0:(1-1/nL)*(p.shuttle_xfer_s+L.tl)),scD=scR-(1-1/nL)*(p.shuttle_xfer_s+L.tl),need=c=>Math.ceil(pk/(3600/c*p.max_util));
h+=`<h2>C. Where the technology makes sense</h2>`+
`<p><b>a) ABC:</b> top ${f(p.abc_sku_share*100)}% of SKUs carry ${f(p.abc_flow_share*100)}% of flow. Keep them on low levels near the lifts (orange). Lift ride to level 2 is ${f(2*tt(p.first_level+p.level_pitch,p.lift_v,p.lift_a))} s round trip against ${f(2*L.tl)} s on average.</p>`+
`<p><b>b) Shuttles between floors:</b> dedicated cycle ${f(scD)} s, needs at least ${Math.max(nL,need(scD))} shuttles (one per level). Roaming cycle ${f(scR)} s, needs ${need(scR)} shuttles at ${f(p.max_util*100)}% utilisation.</p>`+
`<p><b>c) Resilience:</b> one lift down gives ${L.lud>5?'n/a':f(L.lud*100)+'%'} lift utilisation (limit ${f(p.max_util_degraded*100)}%). One shuttle down gives ${L.sud>5?'n/a':f(L.sud*100)+'%'}.</p>`+
`<p><b>d) Energy:</b> lifts average ${f(L.lkw,1)} kW of ${f(nl*p.lift_kw)} kW installed. Shuttles average ${f(L.skw,2)} kW. Total ${f(L.kd)} kWh/day, ${f(L.kd/L.pd,2)} kWh per pallet. Shuttle battery ${p.battery_h} h, charge ${p.charge_h} h, so ${Math.ceil(ns*(p.battery_h+p.charge_h)/p.battery_h)} shuttles for 24 h operation.</p>`+
`<p><b>e) Throughput:</b> demand ${pk} pal/h. Lift capacity ${f(nl*L.lr)} pal/h, shuttle capacity ${f(ns*L.sr)} pal/h. Transfers are ${f((p.lane_xfer_s+p.liftside_xfer_s)/L.sc*100)}% of the shuttle cycle.</p>`+
`<p><b>f) Expansion:</b> +1 shuttle gives ${f(pk/((ns+1)*L.sr)*100)}% utilisation. +1 lift gives ${f(pk/((nl+1)*L.lr)*100)}%. Each extra lane column adds ${nL*nA*nF*nD} pallets. Each extra level adds ${nA*nC*nF*nD}.</p>`;
$('#out').innerHTML=h}
$('#ob').onclick=()=>{const o=$('#out');o.hidden=!o.hidden;if(!o.hidden)report()};
$('#side').addEventListener('input',()=>setTimeout(()=>{if(!$('#out').hidden)report()},450));
const mat0=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const d=Math.min(.05,mat0.getDelta());cu();if(play&&AN.sh){const dt=d*$('#spd').value,A=AN,p=A.p;
for(const s of A.sh){const v=p.shuttle_v*dt;switch(s.st){
case 0:if((s.w-=dt)<=0)s.st=1;break;
case 1:s.a=mv(s.a,s.ta,v);if(s.a==s.ta){s.st=2;s.w=p.turn_s}break;
case 2:if((s.w-=dt)<=0)s.st=3;break;
case 3:s.co=mv(s.co,s.tc,v);if(s.co==s.tc){s.st=4;s.w=p.lane_xfer_s}break;
case 4:if((s.w-=dt)<=0){s.carry=!s.carry;s.st=5}break;
case 5:s.co=mv(s.co,0,v);if(!s.co){s.st=6;s.w=p.turn_s}break;
case 6:if((s.w-=dt)<=0)s.st=7;break;
case 7:s.a=mv(s.a,s.home,v);if(s.a==s.home){A.job(s);s.st=0;s.w=p.liftside_xfer_s}}
const q=A.M(s.a,A.cc(s.ai)+s.co,A.hl(s.lvl)+.2);s.m.position.copy(q);s.cp.visible=s.carry;s.cp.position.set(q.x,q.y+.8,q.z)}
for(const l of A.lifts){const lv=p.lift_v*dt;
if(l.st==0){if((l.w-=dt)<=0)l.st=1}else if(l.st==1){l.h=mv(l.h,A.hl(l.lvl),lv);if(l.h==A.hl(l.lvl)){l.st=2;l.w=A.xm}}
else if(l.st==2){if((l.w-=dt)<=0)l.st=3}else{l.h=mv(l.h,0,lv);if(!l.h){l.st=0;l.w=p.chain_xfer_s;l.lvl=Math.floor(rnd()*A.nL)}}
const q=A.M(l.a,l.c,l.h+.25);l.cab.position.copy(q);l.pl.visible=l.st<2;l.pl.position.set(q.x,q.y+1,q.z)}}
R.render(scn,cam)}
build();loop();
